<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-PKKM | 3D Clay Modern UI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Library untuk Export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>
        :root {
            /* Palette Clay/Neumorphism Terang */
            --bg-clay: #e0e5ec;
            --shadow-light: rgba(255, 255, 255, 0.8);
            --shadow-dark: rgba(163, 177, 198, 0.5);
            --text-main: #2d3748;
            --text-muted: #718096;
            --accent-primary: #4a90e2;
            --accent-glow: rgba(74, 144, 226, 0.4);
        }

        body {
            background-color: var(--bg-clay);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        /* 3D Shapes Background */
        .clay-shape {
            position: absolute;
            border-radius: 50%;
            background: var(--bg-clay);
            box-shadow: 15px 15px 30px var(--shadow-dark), -15px -15px 30px var(--shadow-light);
            z-index: -1;
            animation: floatShape 20s infinite alternate ease-in-out;
        }
        .shape-1 { top: 5%; left: 10%; width: 300px; height: 300px; }
        .shape-2 { bottom: 10%; right: 5%; width: 400px; height: 400px; animation-delay: -5s; }
        .shape-3 { top: 40%; left: 50%; width: 150px; height: 150px; animation-delay: -10s; }

        @keyframes floatShape {
            0% { transform: translate(0, 0) rotate(0deg); }
            100% { transform: translate(30px, 50px) rotate(20deg); }
        }

        /* Komponen UI: 3D Clay Card */
        .clay-card {
            background: var(--bg-clay);
            border-radius: 1.5rem;
            box-shadow: 9px 9px 16px var(--shadow-dark), -9px -9px 16px var(--shadow-light);
            border: 1px solid rgba(255,255,255,0.4);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        /* Komponen UI: Interactive Dataplane Card (Hover) */
        .clay-card-interactive:hover {
            transform: translateY(-5px);
            box-shadow: 12px 12px 20px var(--shadow-dark), -12px -12px 20px var(--shadow-light);
        }

        /* Komponen UI: Glassmorphism dipadu Clay */
        .clay-glass {
            background: rgba(224, 229, 236, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 1.5rem;
            box-shadow: 9px 9px 16px rgba(163, 177, 198, 0.3), -9px -9px 16px rgba(255, 255, 255, 0.6);
            border: 1px solid rgba(255,255,255,0.6);
        }

        /* Komponen UI: Input & Panel Dalam (Inset Shadow) */
        .clay-inset {
            background: var(--bg-clay);
            border-radius: 1rem;
            box-shadow: inset 5px 5px 10px var(--shadow-dark), inset -5px -5px 10px var(--shadow-light);
            border: none;
            color: var(--text-main);
            padding: 0.75rem 1.25rem;
            width: 100%;
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }
        .clay-inset:focus {
            outline: none;
            box-shadow: inset 7px 7px 14px var(--shadow-dark), inset -7px -7px 14px var(--shadow-light), 0 0 0 3px rgba(74, 144, 226, 0.2);
        }
        select.clay-inset, textarea.clay-inset { border-radius: 1rem; }

        /* Komponen UI: Tombol 3D */
        .clay-btn {
            background: var(--bg-clay);
            border-radius: 999px;
            box-shadow: 6px 6px 12px var(--shadow-dark), -6px -6px 12px var(--shadow-light);
            color: var(--text-main);
            font-weight: 600;
            transition: all 0.2s ease;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            border: none;
        }
        .clay-btn:active {
            box-shadow: inset 4px 4px 8px var(--shadow-dark), inset -4px -4px 8px var(--shadow-light);
        }

        .clay-btn-primary {
            background: linear-gradient(135deg, #4a90e2, #007aff);
            color: white;
            box-shadow: 5px 5px 12px var(--accent-glow), -5px -5px 12px var(--shadow-light), inset 2px 2px 5px rgba(255,255,255,0.3);
        }
        .clay-btn-primary:active {
            box-shadow: inset 4px 4px 8px rgba(0,0,0,0.2);
        }

        .clay-btn-danger {
            background: linear-gradient(135deg, #ff6b6b, #ee5253);
            color: white;
            box-shadow: 5px 5px 12px rgba(238, 82, 83, 0.3), -5px -5px 12px var(--shadow-light), inset 2px 2px 5px rgba(255,255,255,0.3);
        }

        /* Sidebar Navigation */
        .nav-clay {
            position: relative;
            transition: all 0.3s ease;
            border-radius: 0.75rem;
            color: var(--text-muted);
            font-weight: 600;
        }
        .nav-clay.active {
            background: var(--bg-clay);
            box-shadow: inset 4px 4px 8px var(--shadow-dark), inset -4px -4px 8px var(--shadow-light);
            color: var(--accent-primary);
        }
        .nav-clay:hover:not(.active) { color: var(--text-main); }

        /* Tables */
        .clay-table { border-collapse: separate; border-spacing: 0 0.8rem; width: 100%; }
        .clay-table th { padding: 1rem; color: var(--text-muted); font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; font-weight: 800; border-bottom: 2px solid rgba(0,0,0,0.05); }
        .clay-table tr.clay-row { 
            background: var(--bg-clay); 
            box-shadow: 4px 4px 8px var(--shadow-dark), -4px -4px 8px var(--shadow-light);
            border-radius: 1rem;
            transition: all 0.25s ease; 
        }
        .clay-table tr.clay-row:hover { transform: scale(1.01); }
        .clay-table td { padding: 1rem; border: none; }
        .clay-table td:first-child { border-top-left-radius: 1rem; border-bottom-left-radius: 1rem; }
        .clay-table td:last-child { border-top-right-radius: 1rem; border-bottom-right-radius: 1rem; }

        /* Chart Bar / Progress Indicator */
        .clay-progress-bar {
            background: var(--bg-clay);
            box-shadow: inset 3px 3px 6px var(--shadow-dark), inset -3px -3px 6px var(--shadow-light);
            border-radius: 999px;
            overflow: hidden;
            height: 12px;
        }
        .clay-progress-fill {
            background: linear-gradient(90deg, #4a90e2, #007aff);
            height: 100%;
            border-radius: 999px;
            box-shadow: inset 0 2px 4px rgba(255,255,255,0.4);
        }

        #loading-overlay { z-index: 9999; }
        #toast-container { z-index: 2000; pointer-events: none; }
        .modal-overlay { z-index: 1000; }
    </style>
</head>
<body class="antialiased relative">
    <div class="fixed inset-0 z-[-1] overflow-hidden">
        <div class="clay-shape shape-1"></div>
        <div class="clay-shape shape-2"></div>
        <div class="clay-shape shape-3"></div>
    </div>

    <!-- LOADING OVERLAY -->
    <div id="loading-overlay" class="fixed inset-0 bg-[#e0e5ec]/80 backdrop-blur-md hidden flex-col justify-center items-center">
        <div class="relative w-20 h-20">
            <div class="absolute inset-0 border-4 border-t-blue-500 border-r-indigo-500 border-b-cyan-500 border-l-transparent rounded-full animate-spin"></div>
            <i class="fas fa-layer-group absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 text-blue-500 text-2xl"></i>
        </div>
        <p class="text-slate-700 font-bold tracking-widest text-xs mt-6 animate-pulse" id="loading-text">MEMUAT SISTEM...</p>
    </div>

    <div id="toast-container" class="fixed top-6 right-6 flex flex-col gap-3 items-end"></div>
    <div id="modal-overlay" class="modal-overlay fixed inset-0 bg-slate-900/40 backdrop-blur-sm hidden justify-center items-center p-4">
        <div id="modal-content" class="clay-card w-full max-w-lg p-8 transform scale-95 transition-all duration-300 max-h-[90vh] overflow-y-auto border-t-4 border-t-blue-500"></div>
    </div>

    <!-- LOGIN SECTION -->
    <div id="login-section" class="min-h-screen flex items-center justify-center p-4 relative z-10">
        <div class="clay-glass w-full max-w-md p-10 text-center relative overflow-hidden">
            <div class="mb-8">
                <div id="login-logo-container" class="w-24 h-24 mx-auto bg-gradient-to-tr from-blue-500 to-cyan-400 rounded-2xl flex items-center justify-center mb-6 shadow-lg shadow-blue-500/30 border border-white/40 p-2 overflow-hidden">
                    <i class="fas fa-cubes text-3xl text-white drop-shadow-md"></i>
                </div>
                <h1 id="login-title" class="text-2xl font-extrabold tracking-tight text-slate-800 leading-tight">E-PKKM</h1>
                <p class="text-xs text-slate-500 mt-2 font-bold tracking-wide uppercase">Sistem PKKM</p>
            </div>
            <form id="login-form" class="space-y-5" onsubmit="handleLogin(event)">
                <div class="text-left relative">
                    <i class="fas fa-user absolute left-4 top-1/2 transform -translate-y-1/2 text-slate-400 text-sm"></i>
                    <input type="text" id="username" class="clay-inset pl-12" placeholder="Username" required autocomplete="off">
                </div>
                <div class="text-left relative">
                    <i class="fas fa-lock absolute left-4 top-1/2 transform -translate-y-1/2 text-slate-400 text-sm"></i>
                    <input type="password" id="password" class="clay-inset pl-12 pr-10" placeholder="Password" required>
                    <button type="button" onclick="togglePassword()" class="absolute right-4 top-1/2 transform -translate-y-1/2 text-slate-400 hover:text-blue-500 focus:outline-none">
                        <i class="fas fa-eye" id="toggle-pwd-icon"></i>
                    </button>
                </div>
                <button type="submit" class="clay-btn clay-btn-primary w-full py-3.5 mt-4 text-sm tracking-wider uppercase">
                    Masuk Sistem <i class="fas fa-arrow-right ml-2 text-xs"></i>
                </button>
            </form>
        </div>
    </div>

    <!-- MAIN APP SECTION -->
    <div id="app-section" class="hidden h-screen p-4 flex flex-col md:flex-row gap-6 app-content box-border">
        <!-- Sidebar -->
        <aside class="w-full md:w-[280px] clay-card flex flex-col h-auto md:h-full shrink-0 overflow-hidden relative z-20">
            <div class="p-6 flex items-center gap-4 border-b border-white/30">
                <div class="w-12 h-12 bg-gradient-to-tr from-blue-500 to-cyan-400 rounded-2xl flex items-center justify-center shadow-lg shadow-blue-500/20 border border-white/50">
                    <i class="fas fa-cubes text-white text-xl"></i>
                </div>
                <div>
                    <h2 class="font-extrabold text-lg tracking-wide text-slate-800 leading-tight">E-PKKM</h2>
                    <span id="sidebar-role" class="text-[10px] uppercase tracking-widest text-blue-600 font-bold">Role</span>
                </div>
            </div>
            <nav class="flex-1 px-4 py-6 space-y-3 overflow-y-auto" id="sidebar-nav"></nav>
            <div class="p-5 border-t border-white/30 mt-auto bg-[#e0e5ec]">
                <div class="flex items-center gap-3 mb-5 px-2">
                    <img src="" alt="Avatar" id="user-avatar" class="w-10 h-10 rounded-full shadow-md">
                    <div class="overflow-hidden">
                        <p id="user-name-display" class="text-sm font-bold truncate text-slate-800">User</p>
                        <p class="text-[9px] text-emerald-500 uppercase tracking-widest font-bold"><i class="fas fa-circle text-[7px] mr-1"></i> Online</p>
                    </div>
                </div>
                <button onclick="handleLogout()" class="clay-btn w-full py-2.5 text-xs text-rose-500 hover:text-rose-600">
                    <i class="fas fa-sign-out-alt mr-1"></i> Keluar Sistem
                </button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 clay-glass flex flex-col h-full relative overflow-hidden z-20">
            <header class="h-20 flex items-center justify-between px-8 border-b border-white/40 shrink-0 backdrop-blur-md bg-[#e0e5ec]/60">
                <h2 id="page-title" class="text-xl font-extrabold text-slate-800">Dashboard</h2>
                <div class="flex items-center gap-3">
                    <div class="hidden md:flex flex-col items-end mr-3">
                        <span id="madrasah-name-display" class="text-sm font-bold text-slate-800">Madrasah</span>
                        <span id="tahun-ajaran-display" class="text-[10px] text-blue-500 font-bold uppercase tracking-wider">Thn Pelajaran 2026/2027</span>
                    </div>
                </div>
            </header>
            <div class="flex-1 overflow-y-auto p-6 md:p-8 z-10" id="main-content-area"></div>
        </main>
    </div>

    <!-- BACKEND API URL PLACEHOLDER -->
    <script>
        /**
         * ============================================================
         * WAJIB DIUBAH!
         * Ganti URL di bawah dengan URL Web App Apps Script Anda.
         * ============================================================
         */
        const APP_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzXKAx8ZNFp9VvbW--QCMuihTLts0siALvI8882wNO1mZKV2o3zxg0zBmw6odDemGNR/exec";

        let currentUser = null;
        let globalData = { settings: {}, komponen: [], sub: [], indikator: [], penilaian: [] };
        
        // VARIABEL STATE UNTUK MENCEGAH JUMP KE DASHBOARD
        let currentView = 'dashboard';

        window.onload = () => {
            initLoginUI();
            checkSession();
        };

        function initLoginUI() {
            let cachedNama = localStorage.getItem('madrasah_nama') || 'E-PKKM';
            let cachedLogo = localStorage.getItem('madrasah_logo') || '';
            document.getElementById('login-title').innerText = cachedNama;
            if(cachedLogo) {
                document.getElementById('login-logo-container').innerHTML = `<img src="${cachedLogo}" alt="Logo" class="w-full h-full object-contain drop-shadow-md">`;
            }
        }

        async function checkSession() {
            let token = sessionStorage.getItem('token');
            let userStr = sessionStorage.getItem('user');
            if (token && userStr) {
                currentUser = JSON.parse(userStr);
                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('app-section').classList.remove('hidden');
                await loadAllData();
            }
        }

        function togglePassword() {
            const pwdInput = document.getElementById('password');
            const pwdIcon = document.getElementById('toggle-pwd-icon');
            if (pwdInput.type === 'password') {
                pwdInput.type = 'text'; pwdIcon.className = "fas fa-eye-slash";
            } else {
                pwdInput.type = 'password'; pwdIcon.className = "fas fa-eye";
            }
        }

        function showLoading(show, text = "MEMPROSES...") {
            const overlay = document.getElementById('loading-overlay');
            document.getElementById('loading-text').innerText = text;
            if (show) { overlay.classList.remove('hidden'); overlay.classList.add('flex'); }
            else { overlay.classList.add('hidden'); overlay.classList.remove('flex'); }
        }

        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            let borderClass = "border-blue-500", iconColor = "text-blue-500", icon = "fa-info-circle";
            if (type === 'success') { borderClass = "border-emerald-500"; iconColor = "text-emerald-500"; icon = "fa-check-circle"; }
            if (type === 'error') { borderClass = "border-rose-500"; iconColor = "text-rose-500"; icon = "fa-exclamation-circle"; }

            toast.className = `clay-card border-l-4 ${borderClass} px-5 py-4 flex items-center gap-4 transform transition-all duration-300 translate-x-full opacity-0 min-w-[300px] mb-3`;
            toast.innerHTML = `<i class="fas ${icon} ${iconColor} text-xl"></i><div><h4 class="font-bold text-xs tracking-wider text-slate-800 uppercase">${type}</h4><p class="text-xs text-slate-600 mt-0.5 font-medium">${message}</p></div>`;
            container.appendChild(toast);
            setTimeout(() => toast.classList.remove('translate-x-full', 'opacity-0'), 10);
            setTimeout(() => { toast.classList.add('translate-x-full', 'opacity-0'); setTimeout(() => toast.remove(), 300); }, 3000);
        }

        function showModal(title, contentHtml, onConfirm = null, confirmText = "Simpan", isDanger = false) {
            const overlay = document.getElementById('modal-overlay');
            const content = document.getElementById('modal-content');
            let btnClass = isDanger ? 'clay-btn-danger' : 'clay-btn-primary';
            let buttonsHtml = `<button type="button" onclick="closeModal()" class="clay-btn px-5 py-2.5 text-xs">Batal</button>`;
            if (onConfirm) buttonsHtml += `<button type="button" id="modal-confirm-btn" class="clay-btn ${btnClass} px-6 py-2.5 text-xs">${confirmText}</button>`;

            content.innerHTML = `
                <div class="flex justify-between items-center mb-6">
                    <h3 class="text-xl font-extrabold text-slate-800">${title}</h3>
                    <button onclick="closeModal()" class="w-8 h-8 rounded-full clay-btn flex items-center justify-center text-slate-500 hover:text-slate-800"><i class="fas fa-times text-xs"></i></button>
                </div>
                <div class="mb-8">${contentHtml}</div>
                <div class="flex justify-end gap-4">${buttonsHtml}</div>
            `;
            overlay.classList.remove('hidden'); overlay.classList.add('flex');
            if (onConfirm) document.getElementById('modal-confirm-btn').onclick = () => onConfirm();
        }

        function closeModal() {
            document.getElementById('modal-overlay').classList.add('hidden');
            document.getElementById('modal-overlay').classList.remove('flex');
        }

        async function callApi(action, payload = {}) {
            showLoading(true);
            try {
                let response = await fetch(APP_SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action, ...payload, session_token: sessionStorage.getItem('token') })
                });
                let res = await response.json();
                showLoading(false);
                return res;
            } catch (err) {
                showLoading(false);
                showToast("Koneksi server gagal!", "error");
                return { success: false, message: err.toString() };
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            let res = await callApi('login', { username, password });
            if (res.success) {
                currentUser = res.user;
                sessionStorage.setItem('token', res.token);
                sessionStorage.setItem('user', JSON.stringify(res.user));
                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('app-section').classList.remove('hidden');
                currentView = 'dashboard'; // Set view awal
                await loadAllData();
                showToast("Login Berhasil", "success");
            } else {
                showToast(res.message || "Gagal masuk", "error");
            }
        }

        function handleLogout() {
            showModal("Konfirmasi Keluar", "<p class='text-sm text-slate-600 font-medium'>Yakin ingin mengakhiri sesi aplikasi ini?</p>", async () => {
                closeModal();
                await callApi('logout');
                sessionStorage.clear();
                window.location.reload();
            }, "Keluar", true);
        }

        async function loadAllData() {
            let res = await callApi('get_app_data');
            if(res.success) {
                globalData = res.data;
                // Pengaman jika database dari sheet masih kosong
                globalData.komponen = globalData.komponen || [];
                globalData.sub = globalData.sub || [];
                globalData.indikator = globalData.indikator || [];
                globalData.settings = globalData.settings || {};

                // Simpan identitas ke local storage untuk Halaman Login
                localStorage.setItem('madrasah_nama', globalData.settings.nama_madrasah || "E-PKKM");
                localStorage.setItem('madrasah_logo', globalData.settings.logo_url || "");
                initLoginUI();

                document.getElementById('user-name-display').innerText = currentUser.name;
                document.getElementById('sidebar-role').innerText = currentUser.role === 'kepsek' ? 'KEPALA MADRASAH' : currentUser.role === 'pj' ? `PJ Kriteria ${currentUser.kriteria_id}` : 'ADMIN';
                document.getElementById('user-avatar').src = `https://ui-avatars.com/api/?name=${encodeURIComponent(currentUser.name)}&background=e0e5ec&color=4a90e2&rounded=true&bold=true`;
                
                document.getElementById('madrasah-name-display').innerText = globalData.settings.nama_madrasah || "Madrasah";
                let thnAjaran = globalData.settings.tahun_ajaran || "2026/2027";
                let thnPkkm = globalData.settings.tahun_pkkm || "2026";
                document.getElementById('tahun-ajaran-display').innerText = `THN PELAJARAN ${thnAjaran} | PKKM ${thnPkkm}`;

                buildSidebar();
                
                // MENGGUNAKAN currentView UNTUK MENCEGAH JUMP KE DASHBOARD SETELAH EDIT
                navigate(currentView); 
            }
        }

        function buildSidebar() {
            const nav = document.getElementById('sidebar-nav');
            nav.innerHTML = '';
            const menu = [
                { id: 'dashboard', icon: 'fa-chart-pie', text: 'Dashboard Analisis', roles: ['admin', 'kepsek', 'pj'] },
                { id: 'instrumen', icon: 'fa-list-check', text: 'Instrumen & Bukti', roles: ['kepsek', 'pj', 'admin'] },
                { id: 'admin_kriteria', icon: 'fa-layer-group', text: 'Master Kriteria & Sub', roles: ['admin'] },
                { id: 'admin_pj', icon: 'fa-users-gear', text: 'Manajemen Akun PJ', roles: ['admin'] },
                { id: 'laporan', icon: 'fa-file-export', text: 'Pusat Export Data', roles: ['admin', 'kepsek', 'pj'] },
                { id: 'settings', icon: 'fa-sliders', text: 'Pengaturan Sistem', roles: ['admin'] }
            ];
            menu.forEach(m => {
                if(m.roles.includes(currentUser.role)) {
                    nav.innerHTML += `<button onclick="navigate('${m.id}')" id="nav-${m.id}" class="nav-clay w-full text-left px-5 py-3.5 text-xs flex items-center gap-4"><i class="fas ${m.icon} w-5 text-center text-lg"></i> ${m.text}</button>`;
                }
            });
        }

        function navigate(viewId) {
            currentView = viewId; // Simpan state view saat ini
            document.querySelectorAll('#sidebar-nav button').forEach(b => b.classList.remove('active'));
            const btn = document.getElementById(`nav-${viewId}`);
            if(btn) btn.classList.add('active');
            const container = document.getElementById('main-content-area');
            const title = document.getElementById('page-title');

            if(viewId === 'dashboard') { title.innerText = "Grafik & Analisis"; renderDashboard(container); }
            else if(viewId === 'instrumen') { title.innerText = "Kartu Instrumen Penilaian"; renderInstrumen(container); }
            else if(viewId === 'admin_kriteria') { title.innerText = "Struktur Master Kriteria"; renderAdminKriteria(container); }
            else if(viewId === 'admin_pj') { title.innerText = "Dataran Pengemudi PJ"; renderAdminPJ(container); }
            else if(viewId === 'settings') { title.innerText = "Konfigurasi Madrasah"; renderSettings(container); }

        function previewLogo(event) {
            const preview = document.getElementById('logo-preview');
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    preview.src = e.target.result;
                    preview.classList.remove('hidden');
                }
                reader.readAsDataURL(file);
            }
        }

        function resizeImage(file, maxSize) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;
                        if (width > height) {
                            if (width > maxSize) {
                                height *= maxSize / width;
                                width = maxSize;
                            }
                        } else {
                            if (height > maxSize) {
                                width *= maxSize / height;
                                height = maxSize;
                            }
                        }
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL(file.type));
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            });
        }

        async function handleSaveSettings(e) {

            let fileInput = document.getElementById('set-logo-file');
