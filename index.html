<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-PKKM | Penilaian Kinerja Kepala Madrasah</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Library untuk Export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>
        body {
            background-color: #020617;
            color: #f8fafc;
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .blob {
            position: absolute; filter: blur(80px); z-index: -1; opacity: 0.6; animation: moveBlobs 20s infinite alternate ease-in-out;
        }
        .blob-1 { top: -10%; left: -10%; width: 50vw; height: 50vw; background: rgba(99, 102, 241, 0.4); }
        .blob-2 { bottom: -20%; right: -10%; width: 60vw; height: 60vw; background: rgba(236, 72, 153, 0.3); animation-delay: -5s; }
        .blob-3 { top: 40%; left: 30%; width: 40vw; height: 40vw; background: rgba(6, 182, 212, 0.3); animation-delay: -10s; }
        @keyframes moveBlobs {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(5%, 10%) scale(1.1); }
            100% { transform: translate(-5%, -10%) scale(0.9); }
        }
        .glass-panel {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border-radius: 1.5rem;
        }
        .glass-input {
            background: rgba(0, 0, 0, 0.3); border: 1px solid rgba(255, 255, 255, 0.1); color: white;
            border-radius: 999px; padding: 0.75rem 1.25rem; width: 100%; transition: all 0.3s ease; font-size: 0.9rem;
        }
        .glass-input:focus { outline: none; border-color: #0ea5e9; background: rgba(0, 0, 0, 0.5); box-shadow: 0 0 15px rgba(14, 165, 233, 0.3); }
        select.glass-input, textarea.glass-input { border-radius: 1rem; }
        select.glass-input option { background: #0f172a; color: white; }
        .btn-modern {
            border: none; border-radius: 999px; color: white; font-weight: 600; letter-spacing: 0.5px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); cursor: pointer; position: relative; overflow: hidden;
            display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;
        }
        .btn-primary { background: linear-gradient(135deg, #6366f1, #a855f7); box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4); }
        .btn-danger { background: linear-gradient(135deg, #ef4444, #be123c); box-shadow: 0 4px 15px rgba(239, 68, 68, 0.3); }
        .btn-success { background: linear-gradient(135deg, #10b981, #047857); box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3); }
        .btn-warning { background: linear-gradient(135deg, #f59e0b, #b45309); box-shadow: 0 4px 15px rgba(245, 158, 11, 0.3); }
        .btn-secondary { background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255,255,255,0.1); }
        .btn-secondary:hover { background: rgba(255, 255, 255, 0.2); }
        #loading-overlay { z-index: 9999; }
        #toast-container { z-index: 2000; pointer-events: none; }
        .modal-overlay { z-index: 1000; }
        .card-table { border-collapse: separate; border-spacing: 0 0.5rem; width: 100%; }
        .card-table th { padding: 1rem; color: #94a3b8; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; font-weight: 600; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .card-table tr.data-row { background: rgba(255, 255, 255, 0.02); transition: all 0.2s ease; }
        .card-table tr.data-row:hover { background: rgba(255, 255, 255, 0.06); transform: scale(1.01); }
        .card-table td { padding: 1rem; border-top: 1px solid rgba(255,255,255,0.02); border-bottom: 1px solid rgba(255,255,255,0.02); }
        .nav-link { position: relative; transition: all 0.3s; }
        .nav-link::before { content: ''; position: absolute; left: 0; top: 10%; height: 80%; width: 3px; background: linear-gradient(to bottom, #06b6d4, #3b82f6); border-radius: 0 4px 4px 0; transform: scaleY(0); transition: transform 0.3s ease; }
        .nav-link.active::before { transform: scaleY(1); }
        .nav-link.active { background: linear-gradient(90deg, rgba(59,130,246,0.15) 0%, transparent 100%); color: white; font-weight: 600; }
    </style>
</head>
<body class="antialiased">
    <div class="fixed inset-0 z-[-1] overflow-hidden bg-[#020617]">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <!-- LOADING OVERLAY -->
    <div id="loading-overlay" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md hidden flex-col justify-center items-center">
        <div class="relative w-20 h-20">
            <div class="absolute inset-0 border-4 border-t-cyan-400 border-r-indigo-500 border-b-pink-500 border-l-transparent rounded-full animate-spin"></div>
            <i class="fas fa-graduation-cap absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 text-white"></i>
        </div>
        <p class="text-white font-semibold tracking-widest text-sm mt-6 animate-pulse" id="loading-text">MEMPROSES...</p>
    </div>

    <div id="toast-container" class="fixed top-6 right-6 flex flex-col gap-3 items-end"></div>
    <div id="modal-overlay" class="modal-overlay fixed inset-0 bg-slate-950/60 backdrop-blur-md hidden justify-center items-center p-4">
        <div id="modal-content" class="glass-panel w-full max-w-lg p-8 transform scale-95 transition-all duration-300 max-h-[90vh] overflow-y-auto border-t-4 border-t-indigo-500"></div>
    </div>

    <!-- LOGIN SECTION -->
    <div id="login-section" class="min-h-screen flex items-center justify-center p-4 relative z-10">
        <div class="glass-panel w-full max-w-md p-10 text-center relative overflow-hidden">
            <div class="mb-10">
                <div class="w-20 h-20 mx-auto bg-gradient-to-tr from-indigo-500 to-cyan-400 rounded-2xl flex items-center justify-center mb-6 shadow-lg shadow-indigo-500/30">
                    <i class="fas fa-graduation-cap text-4xl text-white"></i>
                </div>
                <h1 class="text-3xl font-extrabold tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-indigo-400 to-pink-400">E-PKKM</h1>
                <p class="text-sm text-slate-400 mt-2 font-medium">Sistem Penilaian Kinerja Kepala Madrasah</p>
            </div>
            <form id="login-form" class="space-y-6" onsubmit="handleLogin(event)">
                <div class="text-left relative">
                    <i class="fas fa-user absolute left-4 top-1/2 transform -translate-y-1/2 text-slate-400 text-sm"></i>
                    <input type="text" id="username" class="glass-input pl-12" placeholder="Username" required autocomplete="off">
                </div>
                <div class="text-left relative">
                    <i class="fas fa-lock absolute left-4 top-1/2 transform -translate-y-1/2 text-slate-400 text-sm"></i>
                    <input type="password" id="password" class="glass-input pl-12 pr-10" placeholder="Password" required>
                    <button type="button" onclick="togglePassword()" class="absolute right-4 top-1/2 transform -translate-y-1/2 text-slate-400 hover:text-cyan-400 focus:outline-none">
                        <i class="fas fa-eye" id="toggle-pwd-icon"></i>
                    </button>
                </div>
                <button type="submit" class="btn-modern btn-primary w-full py-3.5 mt-4 text-sm tracking-wider">
                    MASUK KE SISTEM <i class="fas fa-arrow-right ml-2 text-xs"></i>
                </button>
            </form>
        </div>
    </div>

    <!-- MAIN APP SECTION -->
    <div id="app-section" class="hidden h-screen p-4 flex flex-col md:flex-row gap-4 app-content box-border">
        <aside class="w-full md:w-64 glass-panel flex flex-col h-auto md:h-full shrink-0 overflow-hidden shadow-2xl">
            <div class="p-6 flex items-center gap-4 bg-white/5 border-b border-white/5">
                <div class="w-10 h-10 bg-gradient-to-tr from-indigo-500 to-cyan-400 rounded-xl flex items-center justify-center shadow-lg">
                    <i class="fas fa-graduation-cap text-white text-lg"></i>
                </div>
                <div>
                    <h2 class="font-bold text-lg tracking-wide leading-tight">E-PKKM</h2>
                    <span id="sidebar-role" class="text-[10px] uppercase tracking-wider text-cyan-300 font-bold bg-cyan-900/40 py-0.5 px-2 rounded-md">Role</span>
                </div>
            </div>
            <nav class="flex-1 px-3 py-6 space-y-2 overflow-y-auto" id="sidebar-nav"></nav>
            <div class="p-4 bg-slate-900/40 border-t border-white/5 mt-auto">
                <div class="flex items-center gap-3 mb-4 px-2">
                    <img src="" alt="Avatar" id="user-avatar" class="w-10 h-10 rounded-full border-2 border-indigo-500/50">
                    <div class="overflow-hidden">
                        <p id="user-name-display" class="text-sm font-bold truncate text-slate-200">User</p>
                        <p class="text-[10px] text-slate-400 uppercase">Online</p>
                    </div>
                </div>
                <button onclick="handleLogout()" class="btn-modern btn-secondary w-full py-2.5 text-xs text-slate-300 hover:text-white">
                    <i class="fas fa-sign-out-alt"></i> Akhiri Sesi
                </button>
            </div>
        </aside>

        <main class="flex-1 glass-panel flex flex-col h-full relative overflow-hidden shadow-2xl">
            <header class="h-20 flex items-center justify-between px-8 bg-white/5 border-b border-white/5 shrink-0 z-10 backdrop-blur-md">
                <h2 id="page-title" class="text-2xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-white to-slate-400">Dashboard</h2>
                <div class="flex items-center gap-3">
                    <div class="hidden md:flex flex-col items-end mr-3">
                        <span id="madrasah-name-display" class="text-sm font-semibold text-slate-200">Madrasah</span>
                        <span class="text-[10px] text-cyan-400 uppercase tracking-wider">Tahun Pelajaran 2026/2027</span>
                    </div>
                </div>
            </header>
            <div class="flex-1 overflow-y-auto p-6 md:p-8 z-10" id="main-content-area"></div>
        </main>
    </div>

    <!-- BACKEND API URL PLACEHOLDER -->
    <script>
        /**
         * ============================================================
         * WAJIB DIUBAH!
         * Ganti URL di bawah dengan URL Web App Apps Script Anda setelah deploy.
         * ============================================================
         */
        const APP_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzXKAx8ZNFp9VvbW--QCMuihTLts0siALvI8882wNO1mZKV2o3zxg0zBmw6odDemGNR/exec";

        let currentUser = null;
        let globalData = { settings: {}, komponen: [], sub: [], indikator: [], penilaian: [] };

        function togglePassword() {
            const pwdInput = document.getElementById('password');
            const pwdIcon = document.getElementById('toggle-pwd-icon');
            if (pwdInput.type === 'password') {
                pwdInput.type = 'text'; pwdIcon.className = "fas fa-eye-slash";
            } else {
                pwdInput.type = 'password'; pwdIcon.className = "fas fa-eye";
            }
        }

        function showLoading(show, text = "MEMPROSES...") {
            const overlay = document.getElementById('loading-overlay');
            document.getElementById('loading-text').innerText = text;
            if (show) { overlay.classList.remove('hidden'); overlay.classList.add('flex'); }
            else { overlay.classList.add('hidden'); overlay.classList.remove('flex'); }
        }

        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            let borderClass = "border-blue-500", iconColor = "text-blue-400", icon = "fa-info-circle";
            if (type === 'success') { borderClass = "border-emerald-500"; iconColor = "text-emerald-400"; icon = "fa-check-circle"; }
            if (type === 'error') { borderClass = "border-rose-500"; iconColor = "text-rose-400"; icon = "fa-exclamation-circle"; }

            toast.className = `bg-slate-800 border-l-4 ${borderClass} text-slate-200 px-5 py-4 rounded shadow-2xl flex items-center gap-4 transform transition-all duration-300 translate-x-full opacity-0 min-w-[300px]`;
            toast.innerHTML = `<i class="fas ${icon} ${iconColor} text-2xl"></i><div><h4 class="font-bold text-sm tracking-wide text-white uppercase">${type}</h4><p class="text-sm text-slate-300">${message}</p></div>`;
            container.appendChild(toast);
            setTimeout(() => toast.classList.remove('translate-x-full', 'opacity-0'), 10);
            setTimeout(() => { toast.classList.add('translate-x-full', 'opacity-0'); setTimeout(() => toast.remove(), 300); }, 3000);
        }

        function showModal(title, contentHtml, onConfirm = null, confirmText = "Simpan", isDanger = false) {
            const overlay = document.getElementById('modal-overlay');
            const content = document.getElementById('modal-content');
            let buttonsHtml = `<button type="button" onclick="closeModal()" class="btn-modern btn-secondary px-6 py-2 text-sm">Batal</button>`;
            if (onConfirm) buttonsHtml += `<button type="button" id="modal-confirm-btn" class="btn-modern ${isDanger ? 'btn-danger' : 'btn-success'} px-6 py-2 text-sm">${confirmText}</button>`;

            content.innerHTML = `
                <div class="flex justify-between items-center mb-6">
                    <h3 class="text-2xl font-bold tracking-tight">${title}</h3>
                    <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-slate-800 text-slate-400 hover:text-white transition flex items-center justify-center"><i class="fas fa-times"></i></button>
                </div>
                <div class="mb-8">${contentHtml}</div>
                <div class="flex justify-end gap-3 pt-4 border-t border-slate-700/50">${buttonsHtml}</div>
            `;
            overlay.classList.remove('hidden'); overlay.classList.add('flex');
            if (onConfirm) document.getElementById('modal-confirm-btn').onclick = () => onConfirm();
        }

        function closeModal() {
            document.getElementById('modal-overlay').classList.add('hidden');
            document.getElementById('modal-overlay').classList.remove('flex');
        }

        async function callApi(action, payload = {}) {
            showLoading(true);
            try {
                let response = await fetch(APP_SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action, ...payload, session_token: sessionStorage.getItem('token') })
                });
                let res = await response.json();
                showLoading(false);
                return res;
            } catch (err) {
                showLoading(false);
                showToast("Koneksi server gagal!", "error");
                return { success: false, message: err.toString() };
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            let res = await callApi('login', { username, password });
            if (res.success) {
                currentUser = res.user;
                sessionStorage.setItem('token', res.token);
                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('app-section').classList.remove('hidden');
                await loadAllData();
                showToast("Login Berhasil", "success");
            } else {
                showToast(res.message || "Gagal masuk", "error");
            }
        }

        function handleLogout() {
            showModal("Konfirmasi Sesi", "<p>Yakin ingin keluar?</p>", async () => {
                closeModal();
                await callApi('logout');
                sessionStorage.clear();
                window.location.reload();
            }, "Keluar", true);
        }

        async function loadAllData() {
            let res = await callApi('get_app_data');
            if(res.success) {
                globalData = res.data;
                document.getElementById('user-name-display').innerText = currentUser.name;
                document.getElementById('sidebar-role').innerText = currentUser.role === 'kepsek' ? 'KEPALA MADRASAH' : currentUser.role === 'pj' ? `PJ Kriteria ${currentUser.kriteria_id}` : 'ADMIN';
                document.getElementById('user-avatar').src = `https://ui-avatars.com/api/?name=${encodeURIComponent(currentUser.name)}&background=6366f1&color=fff&rounded=true&bold=true`;
                document.getElementById('madrasah-name-display').innerText = globalData.settings.nama_madrasah || "Madrasah";
                buildSidebar();
                navigate('dashboard');
            }
        }

        function buildSidebar() {
            const nav = document.getElementById('sidebar-nav');
            nav.innerHTML = '';
            const menu = [
                { id: 'dashboard', icon: 'fa-chart-pie', text: 'Dashboard', roles: ['admin', 'kepsek', 'pj'] },
                { id: 'instrumen', icon: 'fa-list-check', text: 'Instrumen & Bukti', roles: ['kepsek', 'pj', 'admin'] },
                { id: 'admin_kriteria', icon: 'fa-layer-group', text: 'Master Kriteria & Sub', roles: ['admin'] },
                { id: 'admin_pj', icon: 'fa-users-gear', text: 'Akun PJ', roles: ['admin'] },
                { id: 'laporan', icon: 'fa-file-export', text: 'Pusat Laporan', roles: ['admin', 'kepsek', 'pj'] },
                { id: 'settings', icon: 'fa-sliders', text: 'Pengaturan', roles: ['admin'] }
            ];
            menu.forEach(m => {
                if(m.roles.includes(currentUser.role)) {
                    nav.innerHTML += `<button onclick="navigate('${m.id}')" id="nav-${m.id}" class="nav-link w-full text-left px-4 py-3.5 rounded-xl text-sm font-medium text-slate-400 hover:text-white flex items-center gap-4"><i class="fas ${m.icon} w-5 text-center text-lg"></i> ${m.text}</button>`;
                }
            });
        }

        function navigate(viewId) {
            document.querySelectorAll('#sidebar-nav button').forEach(b => b.classList.remove('active'));
            const btn = document.getElementById(`nav-${viewId}`);
            if(btn) btn.classList.add('active');
            const container = document.getElementById('main-content-area');
            const title = document.getElementById('page-title');

            if(viewId === 'dashboard') { title.innerText = "Dashboard Utama"; renderDashboard(container); }
            else if(viewId === 'instrumen') { title.innerText = "Instrumen Penilaian"; renderInstrumen(container); }
            else if(viewId === 'admin_kriteria') { title.innerText = "Master Kriteria & Sub Kriteria"; renderAdminKriteria(container); }
            else if(viewId === 'admin_pj') { title.innerText = "Manajemen Akun PJ"; renderAdminPJ(container); }
            else if(viewId === 'settings') { title.innerText = "Pengaturan Madrasah"; renderSettings(container); }
            else if(viewId === 'laporan') { title.innerText = "Pusat Laporan & Export"; renderLaporan(container); }
        }

        function renderDashboard(container) {
            let items = globalData.indikator;
            if(currentUser.role === 'pj') {
                let subs = globalData.sub.filter(s => s.k_id === currentUser.kriteria_id).map(s => s.id);
                items = items.filter(i => subs.includes(i.sub_id));
            }
            let total = items.length;
            let diisi = items.filter(i => i.bukti_url !== "").length;
            let totalSkor = 0; items.forEach(i => totalSkor += (parseFloat(i.skor) || 0));
            let maxSkor = total * 4; let pers = maxSkor === 0 ? 0 : (totalSkor / maxSkor) * 100;

            container.innerHTML = `
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
                    <div class="bg-white/5 border border-white/10 p-6 rounded-2xl"><p class="text-slate-400 text-xs font-bold uppercase mb-1">Total Bukti</p><h3 class="text-4xl font-extrabold text-white">${total}</h3></div>
                    <div class="bg-white/5 border border-white/10 p-6 rounded-2xl"><p class="text-slate-400 text-xs font-bold uppercase mb-1">Bukti Diunggah</p><h3 class="text-4xl font-extrabold text-cyan-400">${diisi}</h3></div>
                    <div class="bg-white/5 border border-white/10 p-6 rounded-2xl"><p class="text-slate-400 text-xs font-bold uppercase mb-1">Skor Total</p><h3 class="text-4xl font-extrabold text-amber-400">${totalSkor} / ${maxSkor}</h3></div>
                    <div class="bg-white/5 border border-white/10 p-6 rounded-2xl"><p class="text-slate-400 text-xs font-bold uppercase mb-1">Persentase</p><h3 class="text-4xl font-extrabold text-pink-400">${pers.toFixed(1)}%</h3></div>
                </div>`;
        }

        function renderInstrumen(container) {
            let html = `<div class="space-y-8">`;
            let comps = globalData.komponen;
            if(currentUser.role === 'pj') comps = comps.filter(k => k.id === currentUser.kriteria_id);

            comps.forEach(c => {
                html += `<div class="bg-white/5 border border-white/10 p-6 rounded-2xl"><h3 class="font-bold text-xl text-cyan-400 mb-4">${c.id}. ${c.nama}</h3>`;
                let subs = globalData.sub.filter(s => s.k_id === c.id);
                subs.forEach(s => {
                    html += `<div class="mb-4 pl-4 border-l-2 border-indigo-500/40"><h4 class="font-semibold text-slate-200 mb-2">${s.kode_sub} - ${s.nama}</h4>
                    <table class="card-table"><thead><tr><th>Keterangan Bukti Fisik</th><th class="w-48 text-center">Dokumen</th><th class="w-24 text-center">Skor</th><th class="w-32 text-center">Aksi</th></tr></thead><tbody>`;
                    let inds = globalData.indikator.filter(i => i.sub_id === s.id);
                    inds.forEach(i => {
                        let btnBukti = i.bukti_url ? `<a href="${i.bukti_url}" target="_blank" class="text-xs text-emerald-400 underline">Lihat Bukti</a>` : `<span class="text-xs text-slate-500 italic">Belum ada</span>`;
                        let action = currentUser.role === 'pj' ? `<button onclick="modalUpload('${i.id}')" class="btn-modern btn-primary text-xs px-3 py-1.5"><i class="fas fa-upload"></i> Upload</button>` :
                                     currentUser.role === 'kepsek' ? `<button onclick="modalNilai('${i.id}')" class="btn-modern btn-success text-xs px-3 py-1.5"><i class="fas fa-star"></i> Nilai</button>` : `-`;
                        html += `<tr class="data-row"><td>${i.keterangan} ${i.catatan ? `<br><span class="text-xs text-amber-300">Catatan: ${i.catatan}</span>` : ''}</td><td class="text-center">${btnBukti}</td><td class="text-center font-bold text-indigo-400">${i.skor || '-'}</td><td class="text-center">${action}</td></tr>`;
                    });
                    html += `</tbody></table></div>`;
                });
                html += `</div>`;
            });
            container.innerHTML = html + `</div>`;
        }

        function renderAdminKriteria(container) {
            let html = `<div class="mb-6 flex gap-3">
                <button onclick="modalKriteria()" class="btn-modern btn-success px-4 py-2 text-sm"><i class="fas fa-plus"></i> Tambah Kriteria</button>
                <button onclick="modalSubKriteria()" class="btn-modern btn-primary px-4 py-2 text-sm"><i class="fas fa-plus"></i> Tambah Sub Kriteria</button>
                <button onclick="modalIndikatorAdmin()" class="btn-modern btn-warning px-4 py-2 text-sm"><i class="fas fa-plus"></i> Tambah Bukti Fisik</button>
            </div><div class="space-y-6">`;

            globalData.komponen.forEach(k => {
                html += `<div class="glass-panel p-6"><h3 class="text-lg font-bold text-cyan-400 mb-3">${k.id}. ${k.nama}</h3>`;
                globalData.sub.filter(s => s.k_id === k.id).forEach(s => {
                    html += `<div class="ml-4 mb-4 p-4 rounded-xl bg-white/5"><h4 class="font-semibold text-slate-200 mb-2">${s.kode_sub} - ${s.nama}</h4>`;
                    globalData.indikator.filter(i => i.sub_id === s.id).forEach(it => {
                        html += `<div class="text-sm text-slate-300 ml-4 py-1 flex justify-between items-center border-b border-white/5"><span>- ${it.keterangan}</span><button onclick="deleteIndikator('${it.id}')" class="text-rose-400"><i class="fas fa-trash text-xs"></i></button></div>`;
                    });
                    html += `</div>`;
                });
                html += `</div>`;
            });
            container.innerHTML = html + `</div>`;
        }

        function renderAdminPJ(container) {
            container.innerHTML = `<div class="glass-panel p-6"><p class="text-slate-300">Modul akun PJ terhubung langsung dengan backend Apps Script.</p></div>`;
        }
        function renderSettings(container) {
            container.innerHTML = `<div class="glass-panel p-6"><p class="text-slate-300">Pengaturan madrasah terhubung otomatis.</p></div>`;
        }
        function renderLaporan(container) {
            container.innerHTML = `<div class="glass-panel p-6 text-center"><button onclick="showToast('Fitur Export Siap','success')" class="btn-modern btn-primary px-6 py-3">Download PDF / Excel</button></div>`;
        }

        function modalUpload(id) {
            showModal("Upload Bukti", `<input type="text" id="up-url" class="glass-input" placeholder="Masukkan URL Google Drive">`, async () => {
                let url = document.getElementById('up-url').value;
                let res = await callApi('upload_bukti', { id, url });
                if(res.success) { closeModal(); await loadAllData(); showToast("Berhasil disimpan", "success"); }
                else showToast(res.message, "error");
            });
        }

        function modalNilai(id) {
            showModal("Berikan Nilai", `<div class="space-y-4"><select id="n-skor" class="glass-input"><option value="4">4 - Amat Baik</option><option value="3">3 - Baik</option><option value="2">2 - Cukup</option><option value="1">1 - Kurang</option></select><textarea id="n-catatan" class="glass-input" placeholder="Catatan..."></textarea></div>`, async () => {
                let skor = document.getElementById('n-skor').value;
                let catatan = document.getElementById('n-catatan').value;
                let res = await callApi('beri_nilai', { id, skor, catatan });
                if(res.success) { closeModal(); await loadAllData(); showToast("Nilai disimpan", "success"); }
                else showToast(res.message, "error");
            });
        }

        function modalKriteria() {
            showModal("Tambah Kriteria", `<div class="space-y-4"><input type="text" id="k-id" class="glass-input" placeholder="Kode (Misal: F)"><input type="text" id="k-nama" class="glass-input" placeholder="Nama Kriteria"></div>`, async () => {
                let id = document.getElementById('k-id').value; let nama = document.getElementById('k-nama').value;
                let res = await callApi('save_kriteria', { id, nama });
                if(res.success) { closeModal(); await loadAllData(); showToast("Ditambahkan", "success"); }
            });
        }

        function modalSubKriteria() {
            let opts = globalData.komponen.map(k => `<option value="${k.id}">${k.id} - ${k.nama}</option>`).join('');
            showModal("Tambah Sub Kriteria", `<div class="space-y-4"><select id="sub-kid" class="glass-input">${opts}</select><input type="text" id="sub-kode" class="glass-input" placeholder="Kode Sub (A.1)"><input type="text" id="sub-nama" class="glass-input" placeholder="Nama Sub"></div>`, async () => {
                let k_id = document.getElementById('sub-kid').value; let kode_sub = document.getElementById('sub-kode').value; let nama = document.getElementById('sub-nama').value;
                let res = await callApi('save_sub', { k_id, kode_sub, nama });
                if(res.success) { closeModal(); await loadAllData(); showToast("Ditambahkan", "success"); }
            });
        }

        function modalIndikatorAdmin() {
            let opts = globalData.sub.map(s => `<option value="${s.id}">${s.kode_sub} - ${s.nama}</option>`).join('');
            showModal("Tambah Bukti Fisik", `<div class="space-y-4"><select id="ind-subid" class="glass-input">${opts}</select><textarea id="ind-ket" class="glass-input" placeholder="Keterangan bukti..."></textarea></div>`, async () => {
                let sub_id = document.getElementById('ind-subid').value; let keterangan = document.getElementById('ind-ket').value;
                let res = await callApi('save_indikator', { sub_id, keterangan });
                if(res.success) { closeModal(); await loadAllData(); showToast("Ditambahkan", "success"); }
            });
        }

        async function deleteIndikator(id) {
            let res = await callApi('delete_indikator', { id });
            if(res.success) { await loadAllData(); showToast("Dihapus", "success"); }
        }
    </script>
</body>
</html>
